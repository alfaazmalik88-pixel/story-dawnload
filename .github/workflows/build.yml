name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ github.workspace }}/app/debug.keystore
        ORG_GRADLE_PROJECT_android.injected.signing.store.password: android
        ORG_GRADLE_PROJECT_android.injected.signing.key.alias: androiddebugkey
        ORG_GRADLE_PROJECT_android.injected.signing.key.password: android

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        
