name: Build Debug & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Corrupt Gradle Wrapper & Set Version
      run: |
        rm -rf gradle/wrapper/gradle-wrapper.jar
        gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore and Ensure Google Services
      run: |
        if [ ! -f "app/release-key.jks" ]; then
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias releasekey -storepass android123 -keypass android123 -dname "CN=Android, OU=Dev, O=Local, L=Unknown, ST=Unknown, C=IN"
        fi
        if [ ! -f "app/google-services.json" ]; then
          echo '{"project_info": {"project_number": "123456789", "project_id": "dummy-project"}, "client": [{"client_info": {"mobilesdk_app_id": "1:1234:android:1234"}, "oauth_client": [], "api_key": [{"current_key": "AIzaSyDummyKey"}], "services": {"analytics_service": {"status": 1}, "app_metrica_service": {"status": 1}, "ads_service": {"status": 2}}}]}' > app/google-services.json
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file="release-key.jks" -Pandroid.injected.signing.store.password="android123" -Pandroid.injected.signing.key.alias="releasekey" -Pandroid.injected.signing.key.password="android123"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
