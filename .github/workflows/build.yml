name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub secrets..."
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
        fi
        if [ -f "release-key.jks" ]; then
          if ! keytool -list -keystore release-key.jks -storepass androidrelease > /dev/null 2>&1; then
            echo "Removing corrupted release-key.jks..."
            rm -f release-key.jks
          fi
        fi
        if [ ! -f "release-key.jks" ]; then
          echo "Generating clean release keystore..."
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -dname "CN=Android Debug, OU=Android, O=Unknown, L=Unknown, ST=Unknown, C=IN" -storepass androidrelease -keypass androidrelease
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
