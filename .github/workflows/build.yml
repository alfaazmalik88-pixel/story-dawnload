name: Build Release App Bundle & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Corrupt Gradle Wrapper & Set Version
      run: |
        rm -rf gradle/wrapper/gradle-wrapper.jar
        gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject Google Services JSON
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

    - name: Setup Release Keystore
      run: |
        keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias releasekey -storepass android123 -keypass android123 -dname "CN=Android, OU=Dev, O=Local, L=Unknown, ST=Unknown, C=IN"

    - name: Build Release App Bundle (.aab)
      run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file="release-key.jks" -Pandroid.injected.signing.store.password="android123" -Pandroid.injected.signing.key.alias="releasekey" -Pandroid.injected.signing.key.password="android123"

    - name: Build Release APK
      run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file="release-key.jks" -Pandroid.injected.signing.store.password="android123" -Pandroid.injected.signing.key.alias="releasekey" -Pandroid.injected.signing.key.password="android123"

    - name: Upload Release App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: app/build/outputs/bundle/release/*.aab

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
